name: Essai contact
on:
  push:
    branches: [claude/page-contact-test]
permissions:
  contents: write
jobs:
  essai:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx expo export -p web
        env:
          EXPO_PUBLIC_API_URL: https://exemple.invalid/fauxserveur
          EXPO_PUBLIC_SITE_URL: https://exemple.invalid
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node scripts/essai/renvoi.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f essai-sortie
          git commit -m "essai" && git push
