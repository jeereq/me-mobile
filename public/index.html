<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <!-- viewport-fit=cover : l'app occupe tout l'écran de l'iPhone, encoche comprise.
         maximum-scale=1 et user-scalable=no : l'app ne zoome pas (pincement, double-tap, mise au point d'un champ). -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />

    <!-- Référencement : le repère du site, plus bas, est remplacé par l'adresse réelle au build (scripts/seo.mjs). -->
    <title>Me · cotisations de groupe, relances, tâches et budgets</title>
    <meta
      name="description"
      content="Me réunit tes cotisations de groupe, relances, tâches, habitudes, projets, budgets et ton agenda au même endroit, et te rappelle ce qui compte au bon moment. Gratuit, sur le web, Android et iOS."
    />
    <meta name="author" content="Me" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1" />
    <meta name="color-scheme" content="dark light" />
    <link rel="canonical" href="%SITE%/" />

    <!-- Aperçu quand le lien est partagé (WhatsApp, Facebook, LinkedIn, Slack…) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Me" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:title" content="Me · ton assistant personnel" />
    <meta
      property="og:description"
      content="Cotisations de groupe, relances, tâches, habitudes, projets et budgets au même endroit."
    />
    <meta property="og:url" content="%SITE%/" />
    <meta property="og:image" content="%SITE%/og.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="L'écran Finances de Me sur ordinateur et sur téléphone : ce qu'il reste à dépenser ce mois-ci et le reste de chaque budget." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Me · ton assistant personnel" />
    <meta
      name="twitter:description"
      content="Cotisations de groupe, relances, tâches, habitudes, projets et budgets au même endroit."
    />
    <meta name="twitter:image" content="%SITE%/og.jpg" />

    <!-- Installation sur l'écran d'accueil (Safari > Partager > Sur l'écran d'accueil) -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Me" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#04080C" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Fiche de l'app pour les moteurs de recherche -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Me",
        "applicationCategory": "ProductivityApplication",
        "operatingSystem": "Web, Android, iOS",
        "inLanguage": "fr",
        "url": "%SITE%/",
        "image": "%SITE%/og.jpg",
        "description": "Me réunit tes cotisations de groupe, relances, tâches, habitudes, projets, budgets et ton agenda au même endroit, et te rappelle ce qui compte au bon moment.",
        "offers": [
          { "@type": "Offer", "name": "Gratuit", "price": "0", "priceCurrency": "USD" },
          { "@type": "Offer", "name": "Finances", "price": "2.99", "priceCurrency": "USD" },
          { "@type": "Offer", "name": "Pro", "price": "4.99", "priceCurrency": "USD" },
          { "@type": "Offer", "name": "Pro 1 (3 h de réunion par mois)", "price": "6.98", "priceCurrency": "USD" },
          { "@type": "Offer", "name": "Pro 2 (10 h de réunion par mois)", "price": "9.98", "priceCurrency": "USD" },
          { "@type": "Offer", "name": "Pro 3 (25 h de réunion par mois)", "price": "14.98", "priceCurrency": "USD" }
        ],
        "featureList": [
          "Cotisations de groupe, chacun son tour ou pour une raison précise",
          "Mission du jour",
          "Relances",
          "Tâches et habitudes",
          "Projets et planning",
          "Réunions enregistrées, transcrites et résumées",
          "Budgets, dépenses et revenus",
          "Objectifs d'épargne",
          "Comptes, devises et relevés bancaires",
          "Prêts, paiements à venir et bilan du mois",
          "Agenda et briefing du matin",
          "Statistiques et rapports"
        ]
      }
    </script>

    <style id="expo-reset">
      html,
      body {
        height: 100%;
        background-color: #04080c;
      }
      body {
        overflow: hidden;
        overscroll-behavior: none;
      }
      /* Pas de zoom au pincement ni au double-tap : seul le défilement reste permis. */
      html,
      body,
      #root {
        touch-action: pan-x pan-y;
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
      /* Le repli sans JavaScript : lisible, et ce que les moteurs lisent avant d'exécuter l'app. */
      .sans-js {
        color: #e8eef5;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        line-height: 1.6;
        margin: 0 auto;
        max-width: 42rem;
        padding: 2rem 1.25rem;
      }
      .sans-js a {
        color: #7cc4ff;
      }
    </style>
    <script src="/avant-app.js"></script>
  </head>

  <body>
    <!-- Écran de démarrage : visible dès le premier affichage, avant le chargement de l'app. Aucune image à télécharger. -->
    <div id="me-splash" aria-hidden="true">
      <div class="me-splash-halo"></div>
      <div class="me-splash-logo">Me</div>
    </div>
    <style>
      #me-splash { position: fixed; inset: 0; z-index: 9999; display: flex; align-items: center; justify-content: center; background: #04080c; transition: opacity 0.28s ease; }
      #me-splash.fini { opacity: 0; pointer-events: none; }
      .me-splash-logo { position: relative; width: 104px; height: 104px; border-radius: 28px; display: flex; align-items: center; justify-content: center; background: #8b9bff; color: #04131c; font: 700 44px/1 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; letter-spacing: -1.5px; box-shadow: 0 18px 50px rgba(139, 155, 255, 0.28); animation: me-splash-entree 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) both; }
      .me-splash-halo { position: absolute; width: 104px; height: 104px; border-radius: 28px; background: rgba(139, 155, 255, 0.35); animation: me-splash-halo 1.5s ease-out 0.3s infinite; }
      @keyframes me-splash-entree { from { opacity: 0; transform: scale(0.86); } to { opacity: 1; transform: scale(1); } }
      @keyframes me-splash-halo { from { opacity: 0.7; transform: scale(1); } to { opacity: 0; transform: scale(1.7); } }
      @media (prefers-reduced-motion: reduce) { .me-splash-logo, .me-splash-halo { animation: none; } .me-splash-halo { display: none; } }
      #me-panne { position: fixed; inset: 0; z-index: 10000; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 24px; text-align: center; background: #04080c; color: #e8eef5; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
      #me-panne h1 { margin: 0; font-size: 20px; font-weight: 600; }
      #me-panne p { margin: 0; max-width: 420px; color: #93a1b0; font-size: 13px; line-height: 1.5; overflow-wrap: anywhere; }
      #me-panne button { min-height: 44px; padding: 0 18px; border: 0; border-radius: 12px; background: #8b9bff; color: #04080c; font: inherit; font-size: 15px; font-weight: 600; cursor: pointer; }
    </style>
    <script src="/demarrage.js"></script>
    <noscript>
      <div class="sans-js">
        <h1>Me · ton assistant personnel</h1>
        <p>
          Me réunit tes relances, tâches, habitudes, projets, budgets et ton agenda au même endroit, et te rappelle ce
          qui compte au bon moment. Chaque action te rapporte des points.
        </p>
        <ul>
          <li><strong>Mission du jour</strong> : relances, tâches urgentes et habitudes du jour en une seule liste.</li>
          <li><strong>Relances</strong> : qui relancer et quand, emails restés sans réponse compris.</li>
          <li><strong>Tâches et habitudes</strong>, avec des rappels adaptés à chaque élément.</li>
          <li><strong>Projets</strong> : tâches, sous-tâches et planning.</li>
          <li><strong>Finances</strong> : budgets, plan de dépenses, revenus, prévisions et alertes.</li>
          <li><strong>Agenda</strong> et <strong>statistiques</strong> pour faire le point.</li>
        </ul>
        <p>Active JavaScript pour utiliser l'application.</p>
        <p>
          <a href="/a-propos">À propos</a> · <a href="/confidentialite">Confidentialité</a> ·
          <a href="/conditions">Conditions d'utilisation</a> · <a href="/cgv">Conditions de vente</a> ·
          <a href="/mentions-legales">Mentions légales</a>
        </p>
      </div>
    </noscript>
    <div id="root"></div>
  </body>
</html>
