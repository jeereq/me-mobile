    <style id="expo-reset">
      html,
      body {
        height: 100%;
        background-color: #04080c;
      }
      body {
        overflow: hidden;
        overscroll-behavior: none;
      }
      /* Pas de zoom au pincement ni au double-tap : seul le défilement reste permis. */
      html,
      body,
      #root {
        touch-action: pan-x pan-y;
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
      /* Le repli sans JavaScript : lisible, et ce que les moteurs lisent avant d'exécuter l'app. */
      .sans-js {
        color: #e8eef5;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        line-height: 1.6;
        margin: 0 auto;
        max-width: 42rem;
        padding: 2rem 1.25rem;
      }
      .sans-js a {
        color: #7cc4ff;
      }
    </style>
    <script>
      // Safari iOS ignore user-scalable=no depuis iOS 10 : on bloque nous-mêmes le pincement.
      // Le double-tap, lui, est coupé par touch-action plus haut, sans retarder ni perdre les clics rapides.
      (function () {
        function bloquer(e) {
          e.preventDefault();
        }
        document.addEventListener('gesturestart', bloquer, { passive: false });
        document.addEventListener('gesturechange', bloquer, { passive: false });
        document.addEventListener(
          'touchmove',
          function (e) {
            if (e.touches.length > 1 || (e.scale !== undefined && e.scale !== 1)) e.preventDefault();
          },
          { passive: false },
        );
      })();
    </script>
    <script>
      // Après une mise à jour du site, un onglet resté ouvert (ou une page en cache) peut chercher un fichier de
      // l'ancienne version, qui n'existe plus : on recharge une fois pour prendre la nouvelle.
      (function () {
        var CLE = 'me-rechargement';
        function recharger() {
          try {
            if (sessionStorage.getItem(CLE)) return;
            sessionStorage.setItem(CLE, '1');
          } catch (e) {
            return;
          }
          location.reload();
        }
        // Une page qui a démarré normalement peut se recharger à nouveau lors de la prochaine mise à jour.
        setTimeout(function () {
          try {
            sessionStorage.removeItem(CLE);
          } catch (e) {}
        }, 15000);
        window.addEventListener(
          'error',
          function (e) {
            var t = e.target;
            if (t && t.tagName === 'SCRIPT' && /\/_expo\/static\//.test(t.src || '')) return recharger();
            if (/_expo\/static\//.test(e.filename || '') && /Unexpected token '<'|Requiring unknown module/.test(e.message || '')) recharger();
          },
          true,
        );
      })();
    </script>

  <body>
    <!-- Écran de démarrage : visible dès le premier affichage, avant le chargement de l'app. Aucune image à télécharger. -->
    <div id="me-splash" aria-hidden="true">
      <div class="me-splash-halo"></div>
      <div class="me-splash-logo">Me</div>
    </div>
    <style>
      #me-splash { position: fixed; inset: 0; z-index: 9999; display: flex; align-items: center; justify-content: center; background: #04080c; transition: opacity 0.28s ease; }
      #me-splash.fini { opacity: 0; pointer-events: none; }
      .me-splash-logo { position: relative; width: 104px; height: 104px; border-radius: 28px; display: flex; align-items: center; justify-content: center; background: #8b9bff; color: #04131c; font: 700 44px/1 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; letter-spacing: -1.5px; box-shadow: 0 18px 50px rgba(139, 155, 255, 0.28); animation: me-splash-entree 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) both; }
      .me-splash-halo { position: absolute; width: 104px; height: 104px; border-radius: 28px; background: rgba(139, 155, 255, 0.35); animation: me-splash-halo 1.5s ease-out 0.3s infinite; }
      @keyframes me-splash-entree { from { opacity: 0; transform: scale(0.86); } to { opacity: 1; transform: scale(1); } }
      @keyframes me-splash-halo { from { opacity: 0.7; transform: scale(1); } to { opacity: 0; transform: scale(1.7); } }
      @media (prefers-reduced-motion: reduce) { .me-splash-logo, .me-splash-halo { animation: none; } .me-splash-halo { display: none; } }
      #me-panne { position: fixed; inset: 0; z-index: 10000; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 24px; text-align: center; background: #04080c; color: #e8eef5; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
      #me-panne h1 { margin: 0; font-size: 20px; font-weight: 600; }
      #me-panne p { margin: 0; max-width: 420px; color: #93a1b0; font-size: 13px; line-height: 1.5; overflow-wrap: anywhere; }
      #me-panne button { min-height: 44px; padding: 0 18px; border: 0; border-radius: 12px; background: #8b9bff; color: #04080c; font: inherit; font-size: 15px; font-weight: 600; cursor: pointer; }
    </style>
    <script>
      // Se ferme quand l'app est prête, jamais avant 600 ms pour ne pas clignoter. Au bout de 5 s, le squelette de
      // chargement prend le relais, mais seulement s'il est là : avant, il ne resterait qu'une page noire.
      (function () {
        var debut = Date.now();
        var ferme = false;
        function vide() {
          var r = document.getElementById('root');
          return !r || !r.children.length;
        }
        window.__fermerSplash = function () {
          if (ferme) return;
          ferme = true;
          setTimeout(function () {
            var s = document.getElementById('me-splash');
            if (!s) return;
            s.classList.add('fini');
            setTimeout(function () { s.remove(); }, 320);
          }, Math.max(0, 600 - (Date.now() - debut)));
        };
        (function attendre() {
          if (Date.now() - debut >= 5000 && !vide()) return window.__fermerSplash();
          if (!ferme) setTimeout(attendre, 500);
        })();

        // Rien ne s'affiche : on le dit, avec l'erreur et une sortie, plutôt qu'une page noire.
        function panne(titre, detail) {
          var p = document.getElementById('me-panne');
          if (p || !vide()) return;
          p = document.createElement('div');
          p.id = 'me-panne';
          var h = document.createElement('h1');
          h.textContent = titre;
          p.appendChild(h);
          if (detail) {
            var d = document.createElement('p');
            d.textContent = detail;
            p.appendChild(d);
          }
          var b = document.createElement('button');
          b.type = 'button';
          b.textContent = 'Recharger';
          b.onclick = function () {
            try {
              sessionStorage.removeItem('me-rechargement');
            } catch (e) {}
            location.reload();
          };
          p.appendChild(b);
          document.body.appendChild(p);
          // Une connexion lente finit par charger l'app : le message s'efface alors.
          var t = setInterval(function () {
            if (vide()) return;
            clearInterval(t);
            p.remove();
          }, 500);
        }
        window.addEventListener(
          'error',
          function (e) {
            var t = e.target;
            var fichier = t && t.tagName === 'SCRIPT';
            if (!fichier && !e.message) return;
            var detail = fichier ? 'Fichier non chargé : ' + t.src : e.message;
            setTimeout(function () { panne("Me n'a pas pu s'afficher", detail); }, 1500);
          },
          true,
        );
        setTimeout(function () { panne('Me met du temps à charger', 'Vérifie ta connexion.'); }, 45000);
      })();
    </script>
