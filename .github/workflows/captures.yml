# Refait les captures de la page d'accueil et l'image de partage à partir de la vraie app, puis les enregistre sur la branche.
# À lancer depuis une branche (Actions > Captures > Run workflow) : le résultat se relit dans la PR de cette branche.
name: Captures

on:
  workflow_dispatch:
  push:
    branches: [claude/captures]
    paths: ['scripts/captures/**', '.github/workflows/captures.yml']

permissions:
  contents: write

jobs:
  capturer:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Sans EXPO_PUBLIC_API_URL, l'app tourne en mode local : les données d'exemple suffisent.
      - run: npx expo export -p web
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node scripts/captures/capturer.mjs
      # Les captures servies telles quelles (manifeste de l'app) restent les mêmes que celles de la page d'accueil.
      - name: Copier les captures du manifeste
        run: cp assets/images/apercu/{pc-finances,pc-planning,tel-accueil,tel-budgets}.jpg public/apercu/
      - name: Enregistrer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images/apercu public/apercu public/og.jpg
          git diff --cached --quiet || (git commit -m "Captures refaites avec le design actuel" && git push)
