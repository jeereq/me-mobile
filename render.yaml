# Déploiement de la version web de me sur Render (New > Blueprint, puis ce dépôt).
# Sur iPhone : ouvrir l'adresse dans Safari > Partager > « Sur l'écran d'accueil ».
services:
  - type: web
    name: me-web
    runtime: static
    buildCommand: npm ci && npx expo export -p web
    staticPublishPath: dist
    envVars:
      - key: EXPO_PUBLIC_API_URL
        value: https://me-api-ua1p.onrender.com
    # Toutes les adresses de l'app (/relances, /sources…) servent la même page.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
