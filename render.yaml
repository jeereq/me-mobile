# Déploiement de la version web de Me sur Render (New > Blueprint, puis ce dépôt).
# Sur iPhone : ouvrir l'adresse dans Safari > Partager > « Sur l'écran d'accueil ».
services:
  - type: web
    name: me-web
    runtime: static
    buildCommand: npm ci && npx expo export -p web
    staticPublishPath: dist
    envVars:
      - key: EXPO_PUBLIC_API_URL
        value: https://me-api-ua1p.onrender.com
    headers:
      - path: /c/*
        name: X-Robots-Tag
        value: "noindex"
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' blob: data: https://api.me.neevo.app https://me-api-ua1p.onrender.com; media-src 'self' blob: data:; frame-src 'self' blob: https://api.me.neevo.app https://me-api-ua1p.onrender.com; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
      - path: /*
        name: X-Content-Type-Options
        value: "nosniff"
      - path: /*
        name: X-Frame-Options
        value: "DENY"
      - path: /*
        name: Referrer-Policy
        value: "no-referrer"
      - path: /*
        name: Permissions-Policy
        value: "camera=(self), microphone=(self), geolocation=(), payment=(), usb=()"
    # Pages légales sans connexion (/a-propos, /confidentialite, /conditions, /cgv, /mentions-legales), comme dans vercel.json.
    # Puis toutes les adresses de l'app (/relances, /sources…) servent la même page.
    routes:
      - type: rewrite
        source: /a-propos
        destination: /a-propos.html
      - type: rewrite
        source: /confidentialite
        destination: /confidentialite.html
      - type: rewrite
        source: /conditions
        destination: /conditions.html
      - type: rewrite
        source: /cgv
        destination: /cgv.html
      - type: rewrite
        source: /conditions-tontines
        destination: /conditions-tontines.html
      - type: rewrite
        source: /mentions-legales
        destination: /mentions-legales.html
      - type: rewrite
        source: /*
        destination: /index.html
